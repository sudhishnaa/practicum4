<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Page - Practicum 4</title>

    <style>
        /* General Layout */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
            font-size: 16px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        /* Heading Styles */
        h1 {
            text-align: center;
            color: darkblue;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
            color: #222;
        }

        /* Product Description */
        .description {
            line-height: 1.5;
            word-spacing: 3px;
            text-align: justify;
        }

        .description::first-letter {
            font-size: 30px;
            font-weight: bold;
        }

        /* Product Section */
        .product {
            display: flex;
            gap: 30px;
            align-items: center;
            margin-top: 25px;
        }

        .product img {
            width: 300px;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        .details {
            flex: 1;
        }

        /* Price Styling */
        .price {
            font-size: 26px;
            font-weight: bold;
            color: green;
        }

        .old-price {
            color: gray;
            text-decoration: line-through;
            font-size: 18px;
        }

        /* Button */
        .buy-btn {
            background-color: darkblue;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .buy-btn:hover {
            background-color: navy;
        }

        /* Highlight Text */
        .highlight {
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            body {
                font-size: 16px;
            }

            .container {
                margin: 10px;
                padding: 15px;
            }

            .product {
                flex-direction: column;
            }

            .product img {
                width: 100%;
                height: auto;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Smart Watch</h1>

        <div class="product">

            <img src="smartwatch.jpg" alt="Smart Watch">

            <div class="details">

                <h2>Premium Smart Watch</h2>

                <p class="description">
                    This premium smart watch is designed for modern users.
                    It provides useful features such as fitness tracking,
                    notifications, heart-rate monitoring and stylish design.
                </p>

                <p>
                    <span class="old-price">₹4,999</span>
                    <span class="price"> ₹3,499</span>
                </p>

                <p class="highlight">Special Offer Available</p>

                <button class="buy-btn">Buy Now</button>

            </div>

        </div>

    </div>

</body>
</html>
